name: AT2

on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    kokkos-version:
      required: false
      type: string
      default: internal

# Cancels any in progress 'workflows' associated with this PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc12-openmpi4
            target-runner-labels: "['self-hosted', 'gcc-12.3.0-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel8_gcc-openmpi_debug_shared_no-kokkos-arch_no-asan_complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-gcc-12.3.0-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_debug_shared
            max-cores-allowed: 29
            num-concurrent-tests: 16
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: clang19-openmpi4
            target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel_clang-openmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release-debug_shared
            max-cores-allowed: 29
            num-concurrent-tests: 16
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: clang19-openmpi4-experimental
            target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel_clang-openmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
            cdash-track: "Pull Request (Non-blocking)"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release-debug_shared_experimental
            max-cores-allowed: 29
            num-concurrent-tests: 16
            # Build, but do not run tests. There is a matching nightly build that also runs the tests.
            skip-run-tests: true
            extra-configure-args: -DTpetra_ENABLE_Experimental=ON;-DAmesos2_ENABLE_Experimental=ON;-DBelos_ENABLE_Experimental=ON;-DIfpack2_ENABLE_Experimental=ON;-DXpetra_ENABLE_Experimental=ON;-DMueLu_ENABLE_Experimental=ON;-DStokhos_ENABLE_Experimental=ON;-DZoltan2Core_ENABLE_Experimental=ON
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: clang19-openmpi4-performance-tests
            target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel_clang-openmpi_release_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release_shared_performance_tests
            max-cores-allowed: 29
            num-concurrent-tests: 16
            extra-configure-args: -DTrilinos_TEST_CATEGORIES=PERFORMANCE
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: cuda12
            target-runner-labels: "['self-hosted', 'cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6', '20260903', 'gpu:A100']"
            genconfig-string: "rhel_cuda-12-gcc-openmpi_release_static_Ampere80_no-asan_complex_no-fpic_mpi_pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release_static
            max-cores-allowed: 56
            num-concurrent-tests: 112
            slots-per-gpu: 8
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: gcc14
            target-runner-labels: "['self-hosted', 'gcc-14', '20260903']"
            genconfig-string: "rhel_gcc_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_no-mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi10-gcc-14:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release-debug_shared
            max-cores-allowed: 29
            num-concurrent-tests: 16
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: cuda12-uvm
            target-runner-labels: "['self-hosted', 'cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel_cuda-gcc-openmpi_release_static_Ampere80_no-asan_complex_no-fpic_mpi_pt_no-rdc_uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release_static_uvm
            max-cores-allowed: 56
            skip-run-tests: true
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: oneapi2024
            target-runner-labels: "['self-hosted', 'oneapi-2024.2', '20260903']"
            genconfig-string: "rhel_oneapi-intelmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-oneapi-2024.2:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release-debug_shared
            max-cores-allowed: 29
            num-concurrent-tests: 16
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: openmp
            target-runner-labels: "['self-hosted', 'gcc-12.3.0-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel8_gcc-openmpi-openmp_release-debug_static_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_no-package-enables"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-gcc-12.3.0-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release-debug_static_openmp
            max-cores-allowed: 29
            num-concurrent-tests: 16
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: framework-tests
            target-runner-labels: "['self-hosted', 'python-3.9', '20260903']"
            genconfig-string: "rhel8_python_debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_no-mpi_no-pt_no-rdc_no-uvm_deprecated-on_pr-framework"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-python-3.9:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_framework-tests
            skip-create-packageenables: true
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

          - name: ramses-openmp
            target-runner-labels: "['self-hosted', 'gcc-12.3.0-openmpi-4.1.6', '20260903']"
            genconfig-string: "rhel8_gcc-openmpi-openmp_release_static_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_ramses"
            image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-gcc-12.3.0-openmpi-4.1.6:20260903
            cdash-track: "Pull Request"
            dashboard-build-name: PR-${{ github.event.pull_request.number }}_${AT2_IMAGE}_release_static_RAMSES
            max-cores-allowed: 29
            num-concurrent-tests: 16
            skip-create-packageenables: true
            extra-configure-args: -C;${GITHUB_WORKSPACE}/packages/framework/cmake-fragments/ramses/gcc-mpi-openmp.cmake
            kokkos-version: ${{ inputs.kokkos-version || 'internal' }}

    uses: ./.github/workflows/ci.yml
    name: ${{ matrix.name}} ${{ matrix.kokkos-version }}
    with:
      target-runner-labels: ${{ matrix.target-runner-labels || '' }}
      genconfig-string: ${{ matrix.genconfig-string || '' }}
      image: ${{ matrix.image || '' }}
      cdash-track: ${{ matrix.cdash-track || '' }}
      dashboard-build-name: ${{ matrix.dashboard-build-name || '' }}
      max-cores-allowed: ${{ matrix.max-cores-allowed || 1 }}
      num-concurrent-tests: ${{ matrix.num-concurrent-tests || 1 }}
      slots-per-gpu: ${{ matrix.slots-per-gpu || 0  }}
      target-branch: ${{ github.base_ref }}
      skip-run-tests: ${{ matrix.skip-run-tests || false }}
      skip-create-packageenables: ${{ matrix.skip-create-packageenables || false }}
      extra-configure-args: ${{ matrix.extra-configure-args || '' }}
      extra-pr-driver-args: ${{ matrix.extra-pr-driver-args || '' }}
      kokkos-version: ${{ matrix.kokkos-version || 'internal' }}
        
    

# This file needs to be on the default branch for the workflow to run.

name: pre-commit-comment

on:
  workflow_run:
    workflows: [pre-commit-run]
    types:
      - completed

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  pull-requests: write

jobs:
  pre-commit-comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
    - name: 'Download artifact'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
             owner: context.repo.owner,
             repo: context.repo.repo,
             run_id: context.payload.workflow_run.id,
          });
          let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "format_patch_message"
          })[0];
          let download = await github.rest.actions.downloadArtifact({
             owner: context.repo.owner,
             repo: context.repo.repo,
             artifact_id: matchArtifact.id,
             archive_format: 'zip',
          });
          const fs = require('fs');
          const path = require('path');
          const temp = '${{ runner.temp }}/artifacts';
          if (!fs.existsSync(temp)){
            fs.mkdirSync(temp);
          }
          fs.writeFileSync(path.join(temp, 'format_patch_message.zip'), Buffer.from(download.data));

    - run: |
        cd ${{ runner.temp }}/artifacts
        unzip format_patch_message.zip

    - name: Find PR associated with failed workflow run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: pr
      env:
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      with:
        script: |
          const run = context.payload.workflow_run;

          if (!run) {
            core.setFailed("No workflow_run payload found.");
            return;
          }

          if (run.event !== "pull_request") {
            core.setFailed(`Workflow run was triggered by ${run.event}, not pull_request.`);
            return;
          }

          const { owner, repo } = context.repo;
          const baseRepoFullName = `${owner}/${repo}`;

          const sha = run.head_sha;
          const headRepoFullName = run.head_repository?.full_name;
          const headBranch = run.head_branch;

          core.info(`Workflow run id: ${run.id}`);
          core.info(`Workflow run URL: ${run.html_url}`);
          core.info(`Workflow run SHA: ${sha}`);
          core.info(`Head repo: ${headRepoFullName}`);
          core.info(`Head branch: ${headBranch}`);
          core.info(`Owner/repo: ${baseRepoFullName}`);

          if (!sha || !headRepoFullName || !headBranch) {
            core.setFailed("Missing required workflow_run metadata.");
            return;
          }

          const prs = await github.paginate(
            github.rest.repos.listPullRequestsAssociatedWithCommit,
            {
              owner,
              repo,
              commit_sha: sha,
              per_page: 100
            }
          );

          core.info(`Found ${prs.length} PR(s) associated with commit ${sha}.`);

          const candidates = prs.filter(pr =>
            pr.base?.repo?.full_name === baseRepoFullName &&
            pr.head?.repo?.full_name === headRepoFullName &&
            pr.head?.ref === headBranch
          );

          if (candidates.length !== 1) {
            core.warning("Could not uniquely identify PR.");
            core.warning("Candidate PRs from GitHub API:");

            for (const pr of prs) {
              core.warning(
                `#${pr.number} state=${pr.state} ` +
                `head=${pr.head?.repo?.full_name}:${pr.head?.ref} ` +
                `headSha=${pr.head?.sha} ` +
                `base=${pr.base?.repo?.full_name}:${pr.base?.ref}`
              );
            }

            core.setFailed(`Expected exactly one matching PR, found ${candidates.length}.`);
            return;
          }

          const pr = candidates[0];

          core.info(`Matched PR #${pr.number}: ${pr.html_url}`);
          core.setOutput("number", String(pr.number));
          core.setOutput("url", pr.html_url);

    - name: Post artifact in issue comment
      id: comment
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0.8.3.12.0
      with:
        message-id: format-patch
        issue: ${{ steps.pr.output.number }}
        refresh-message-position: true
        message-path: ${{ runner.temp }}/artifacts/format_patch_message.txt

    - name: Process message
      run: |
        MY_PR_NUMBER=${{ steps.pr.output.number }}
        MY_COMMENT_ID=${{ steps.comment.outputs.comment-id }}
        cp ${{ runner.temp }}/artifacts/format_patch_message.txt processed_format_patch.txt  
        sed -i "s/PR_NUMBER/${MY_PR_NUMBER}/" processed_format_patch.txt
        sed -i "s/COMMENT_ID/${MY_COMMENT_ID}/" processed_format_patch.txt

    - name: Update comment
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.comment.outputs.comment-id }}
        issue-number: ${{ steps.pr.output.number }}
        body-path: processed_format_patch.txt
        edit-mode: replace

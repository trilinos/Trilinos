[project]
name = "TrilinosDevContainers"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2", "questionary==2.1.1"]
version = "1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true

[project.scripts]
dev-container = "TrilinosDevContainers.script:main"

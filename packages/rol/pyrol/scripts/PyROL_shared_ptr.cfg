# Binder configuration for ROL_Ptr=std::shared_ptr, appended to PyROL_common.cfg.
# Binder's default holder, std::shared_ptr, already matches ROL::Ptr.

# special handling of ROL::Vector::clone
+include_for_class ROL::Vector <PyROL_clone_shared.hpp>
+trampoline_member_function_binder ROL::Vector::clone customClone

# Both overloads (T& and const T&) match, so taking their address is ambiguous.
-function ROL::makePtrFromRef
